<!doctype html><html><head><meta charset="utf-8"><title>Nexara reel</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Nexara Websites showreel, 1080x1920. Every frame is drawn by R(t) from the timeline below (no CSS animation),
   so renders are deterministic. ?story=onejob | whatif */
:root{--ink:#0D0E12;--blue:#2A2BFF;--cream:#FFF6EC;--rust:#6B1D0A;--mist:#E7EBEF;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:'Instrument Sans',sans-serif;color:#fff}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.ab{position:absolute;left:0;top:0;transform-origin:50% 50%}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.028em;line-height:.96;font-variation-settings:'opsz' 96}
.h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;letter-spacing:-.018em;line-height:1.02;font-variation-settings:'opsz' 72}
.lbl{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:24px;letter-spacing:.14em;text-transform:uppercase}
.ui{font-family:'Instrument Sans',sans-serif}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em .03em .14em;margin:-.08em -.03em -.14em}
.i{display:inline-block;will-change:transform}
.a{color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-family:'Instrument Sans';font-weight:600;white-space:nowrap}
/* phone */
.phone{position:absolute;left:0;top:0;background:#0b0b0d;box-shadow:0 0 0 2px #2b2c31 inset,0 40px 90px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.25)}
.phone .scr{position:absolute;overflow:hidden;background:#111}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
.phone .isl{position:absolute;left:50%;background:#000;border-radius:99px;transform:translateX(-50%);z-index:5}
/* browser card */
.brw{position:absolute;left:0;top:0;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.35)}
.brw .bar{height:54px;background:#f1f2f4;display:flex;align-items:center;padding:0 20px;gap:10px}
.brw .bar i{width:14px;height:14px;border-radius:50%;background:#d5d7dc;display:block}
.brw .bar .u{margin-left:18px;flex:1;height:32px;border-radius:9px;background:#fff;font:500 17px 'Instrument Sans';color:#6b6f78;display:flex;align-items:center;padding-left:16px}
.brw .vp{position:absolute;left:0;top:54px;right:0;bottom:0;overflow:hidden}
.brw .vp img{position:absolute;left:0;top:0;width:100%}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;z-index:99;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.cursor{position:absolute;left:0;top:0;width:54px;height:54px;z-index:50;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.tap{position:absolute;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.9);z-index:49}
</style></head><body><div id="stage"></div>
<script>
// ───────────────────────── motion toolkit ─────────────────────────
const W = 1080, H = 1920, stage = document.getElementById('stage');
const Q = new URLSearchParams(location.search), STORYNAME = Q.get('story') || 'onejob';
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const oE = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);                 // out expo
const oC = p => 1 - Math.pow(1 - p, 3);                                  // out cubic
const iC = p => p * p * p;
const ioC = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const ioE = p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2;
const oB = (p, s = 1.6) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);   // out back (overshoot)
const spring = (p, f = 4.5, d = 6) => p <= 0 ? 0 : 1 - Math.exp(-d * p) * Math.cos(f * Math.PI * p);
const E = (t, a, b, ease = oE) => ease(pr(t, a, b));
function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e; }
function css(e, o) { Object.assign(e.style, o); return e; }
// transform setter: x,y = position of the element's top-left; s scale, r rotation, o opacity, b blur(px)
function tf(e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o, b, rx = 0, ry = 0, z = 0 } = {}) {
  e.style.transform = `translate3d(${x}px,${y}px,${z}px)${rx || ry ? ` perspective(1600px) rotateX(${rx}deg) rotateY(${ry}deg)` : ''} rotate(${r}deg) scale(${sx != null ? sx : s},${sy != null ? sy : s})`;
  if (o != null) e.style.opacity = o;
  if (b != null) e.style.filter = b > .05 ? `blur(${b}px)` : 'none';
}
// Text with word masks. {word} = accent (blue by default), | = line break.
function TX(parent, text, cls, style, accent) {
  const box = el('div', 'ab ' + (cls || ''), parent); css(box, style || {});
  const words = [];
  text.split('|').forEach((line, li) => {
    if (li) el('br', null, box);
    line.split(' ').filter(Boolean).forEach((w, wi, arr) => {
      const acc = /^\{.*\}[.,?!]*$/.test(w) || /^\{/.test(w) && w.includes('}');
      const clean = w.replace(/[{}]/g, '');
      const m = el('span', 'w', box); const i = el('span', 'i', m, clean);
      if (/\{/.test(w) || /\}/.test(w)) { i.style.color = accent || 'var(--blue)'; }
      words.push(i); if (wi < arr.length - 1) box.appendChild(document.createTextNode(' '));
    });
  });
  box.words = words; return box;
}
// word reveal: slide up from the mask, staggered
function rise(box, t, t0, { st = .07, d = .55, from = 105, ease = oE, rot = 0 } = {}) {
  box.words.forEach((w, k) => { const p = ease(pr(t, t0 + k * st, t0 + k * st + d)); w.style.transform = `translateY(${(1 - p) * from}%) rotate(${(1 - p) * rot}deg)`; });
}
function sink(box, t, t0, { st = .03, d = .35 } = {}) { // exit: words slide up out of the mask
  if (t < t0) return; box.words.forEach((w, k) => { const p = iC(pr(t, t0 + k * st, t0 + k * st + d)); w.style.transform = `translateY(${-p * 110}%)`; });
}
// slam: words drop in scaled with blur (for big statements)
function slam(box, t, t0, { st = .18, d = .4 } = {}) {
  box.words.forEach((w, k) => { const p = pr(t, t0 + k * st, t0 + k * st + d); const e = oE(p);
    w.style.transform = `scale(${lerp(1.9, 1, e)})`; w.style.opacity = p > 0 ? 1 : 0; w.style.filter = p < 1 ? `blur(${(1 - e) * 14}px)` : 'none'; });
}
function typeIn(e, full, t, t0, cps) { const n = Math.floor(cl((t - t0) * cps, 0, full.length)); e.textContent = full.slice(0, n); return n; }
// phone frame: w = screen width
function phone(parent, w) {
  const h = Math.round(w * 2.164), bz = Math.round(w * .036), R0 = Math.round(w * .155);
  const root = el('div', 'phone', parent); css(root, { width: w + 2 * bz + 'px', height: h + 2 * bz + 'px', borderRadius: R0 + 'px' });
  const scr = el('div', 'scr', root); css(scr, { left: bz + 'px', top: bz + 'px', width: w + 'px', height: h + 'px', borderRadius: (R0 - bz) + 'px' });
  const isl = el('div', 'isl', root); css(isl, { top: bz + w * .028 + 'px', width: w * .29 + 'px', height: w * .085 + 'px' });
  return { root, scr, w, h, W: w + 2 * bz, H: h + 2 * bz, imgs: [] };
}
function shots(ph, srcs) { ph.imgs = srcs.map(s => { const i = el('img', null, ph.scr); i.src = s; return i; }); return ph; }
// Show phone stills as a sequence, each pushing up from below (like a fast scroll). times = start time of each still.
function seq(ph, t, times, { d = .42, ease = ioC } = {}) {
  let k = 0; for (let j = 0; j < times.length; j++) if (t >= times[j]) k = j;
  ph.imgs.forEach((im, j) => {
    if (j === k) { const p = j === 0 ? 1 : ease(pr(t, times[j], times[j] + d)); im.style.transform = `translateY(${(1 - p) * ph.h}px)`; im.style.display = 'block'; im.style.zIndex = 2; im.style.filter = 'none'; }
    else if (j === k - 1) { const p = ease(pr(t, times[k], times[k] + d)); im.style.transform = `translateY(${-p * ph.h * .35}px)`; im.style.display = p < 1 ? 'block' : 'none'; im.style.zIndex = 1; im.style.filter = `brightness(${1 - p * .5})`; }
    else im.style.display = 'none';
  });
}
// continuous scroll of a tall image (full page) inside a phone or browser viewport: y in screen px of the source
function scrollImg(im, y) { im.style.transform = `translateY(${-y}px)`; }
function browser(parent, w, h, url) {
  const root = el('div', 'brw', parent); css(root, { width: w + 'px', height: h + 'px' });
  const bar = el('div', 'bar', root, '<i></i><i></i><i></i><div class="u">' + url + '</div>');
  const vp = el('div', 'vp', root); return { root, vp, w, h };
}
function bg(parent, color) { return css(el('div', 'ab', parent), { width: W + 'px', height: H + 'px', background: color }); }
// cursor (arrow) and a tap ripple
const ARROW = '<svg viewBox="0 0 24 24" width="54" height="54"><path d="M4 2.5l7.8 19.4 2.7-7.7 7.6-2.8z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function tapAt(e, t, t0, x, y) { const p = pr(t, t0, t0 + .45); css(e, { display: p > 0 && p < 1 ? 'block' : 'none' }); tf(e, { x, y, s: lerp(.3, 1.4, oC(p)), o: 1 - p }); }
// clip-path wipes for scene entrances
const wipe = {
  circle: (root, p, cx = 540, cy = 960) => root.style.clipPath = p >= 1 ? 'none' : `circle(${p * 2300}px at ${cx}px ${cy}px)`,
  up: (root, p) => root.style.clipPath = p >= 1 ? 'none' : `inset(${(1 - p) * 100}% 0 0 0)`,
  left: (root, p) => root.style.clipPath = p >= 1 ? 'none' : `inset(0 0 0 ${(1 - p) * 100}%)`,
  diag: (root, p) => { const a = lerp(-1200, 0, p); root.style.clipPath = p >= 1 ? 'none' : `polygon(${a}px 0, ${a + 2300}px 0, ${a + 1200}px 1920px, ${a - 1100}px 1920px)`; },
  blinds: (bars, p) => bars.forEach((b, k) => { const q = ioC(cl(p * 1.6 - k * .12)); b.style.transform = `scaleY(${q})`; }),
};

// ───────────────────────── sites ─────────────────────────
const A = n => `assets/${n}/`;
const SITES = {
  meji:   { name: 'Meji Foods', kind: 'E-commerce', url: 'meji-eight.vercel.app', job: 'Turn an {appetite} into a {basket.}', bg: '#5B1708', fg: '#FFF6EC', acc: '#FF7A3D', m: [0, 3, 5, 6, 9], d: 0 },
  moodring:{ name: 'Moodring', kind: 'Product story', url: 'moodring-five.vercel.app', job: 'Fill a {waitlist} before the product ships.', bg: '#F3DCC4', fg: '#3A1A0E', acc: '#B5541C', m: [0, 1, 3, 8, 13], dseq: [1, 4, 8, 14], qacc: '#E58A4E' },
  bibire: { name: 'BIBIRÉ', kind: 'E-commerce', url: 'bibire-six.vercel.app', job: 'Make a new label feel {established.}', bg: '#0F0F10', fg: '#F2F2F0', acc: '#C9D9C0', qacc: '#1E6B43', m: [0, 2, 4, 5, 7], d: 0 },
  throne: { name: 'The Throneroom', kind: 'House of prayer', url: 'the-throneroom.vercel.app', job: 'Open a house of prayer to {every nation.}', bg: '#1B0E57', fg: '#FFFFFF', acc: '#E2B44A', qacc: '#B07D12', m: [0, 5, 9, 11, 15], d: 0 },
  crib:   { name: 'Crib', kind: 'Rental marketplace', url: 'getyourcrib.app', job: 'Make renters feel {safe} enough to book a viewing.', bg: '#0E1A3F', fg: '#FFFFFF', acc: '#5B8CFF', qacc: '#2C5CE0', m: [0, 4, 5, 9, 11], d: 0 },
  expertlinc:{ name: 'ExpertLinc', kind: 'Careers platform', url: 'expertlinc.com', job: 'Make a new idea feel {worth joining.}', bg: '#0B1F4D', fg: '#FFFFFF', acc: '#7FB2FF', qacc: '#2A5BD7', m: [0, 9, 13], d: 0 },
  moms:   { name: "Mom's Best Choice", kind: 'Product landing page', url: 'momsandmore.com.ng', job: 'Sell one product with {one clear action.}', bg: '#F49A1E', fg: '#2B1503', acc: '#FFFFFF', m: [0, 2, 15], d: 0 },
  wigpa:  { name: 'WIGPA', kind: 'Community', url: 'wigpa.org', job: 'Give a global community {a home.}', bg: '#6E1C24', fg: '#FFF6EC', acc: '#D7AE5E', qacc: '#A0701F', m: [0, 4, 9], d: 0 },
};
const pad = n => String(n).padStart(2, '0');
const msrc = (n, k) => A(n) + 'm_' + pad(k) + '.jpg';

// ───────────────────────── scene registry ─────────────────────────
const scenes = [];
function scene(t0, t1, build) { const root = el('div', 'scene', stage); const upd = build(root, t1 - t0); scenes.push({ t0, t1, root, upd }); }
window.R = t => { for (const s of scenes) { const on = t >= s.t0 && t < s.t1 + .6; /* stays a little longer so the next scene wipes in over it */ s.root.style.display = on ? 'block' : 'none'; if (on) s.upd(t - s.t0, t); } };

// ───────────────────────── shared scenes ─────────────────────────
// Brand mark (top left), present in most scenes
function mark(parent, color, x = 64, y = 70) {
  const m = el('div', 'ab', parent, `<span style="font:800 40px 'Bricolage Grotesque';letter-spacing:-.04em">Nexara</span><span style="font:500 22px 'JetBrains Mono';letter-spacing:.12em;margin-left:14px;opacity:.6">WEBSITES</span>`);
  css(m, { color, left: x + 'px', top: y + 'px' }); return m;
}

// One site "job" card. variant changes the motion so no two sites move alike.
function siteCard(root, key, D, variant, num, total) {
  const S = SITES[key];
  bg(root, S.bg);
  const deco = el('div', 'ab', root);              // per-variant decoration layer (behind phone)
  const label = TX(root, `${pad(num)} / ${pad(total)}  ·  ${S.kind}`, 'lbl', { left: '64px', top: '176px', color: S.fg, opacity: .7 });
  const name = TX(root, S.name, 'h', { left: '60px', top: '226px', fontSize: '74px', color: S.fg });
  const job = TX(root, S.job, 'h', { left: '60px', top: '330px', width: '960px', fontSize: '104px', color: S.fg }, S.acc);
  const ph = phone(root, 470); shots(ph, S.m.map(k => msrc(key, k)));
  const url = el('div', 'ab pill', root, `<span style="width:12px;height:12px;border-radius:50%;background:${S.acc};display:inline-block"></span>${S.url}`);
  css(url, { left: '50%', top: '1806px', fontSize: '30px', color: S.fg, padding: '16px 30px', border: `2px solid ${S.fg}33` });
  const m = mark(root, S.fg);
  const px = (W - ph.W) / 2, py0 = 700;
  // per-variant decoration
  let decoUpd = () => {};
  if (variant === 'clock') {        // Moodring: hour digits ticking behind the phone
    const c = TX(deco, '6:52', 'h', { left: '0px', top: '820px', width: W + 'px', textAlign: 'center', fontSize: '420px', color: S.acc, opacity: .16 });
    const hrs = ['6:52', '9:56', '3:17', '6:42', '11:44']; decoUpd = t => { c.words[0].textContent = hrs[Math.min(hrs.length - 1, Math.floor(t / .38))]; };
  } else if (variant === 'giant') { // BIBIRÉ: giant wordmark sliding behind
    const g = TX(deco, 'BIBIRÉ', 'h', { left: '0px', top: '1180px', fontSize: '360px', color: '#F2F2F0', opacity: .1, whiteSpace: 'nowrap', letterSpacing: '-.02em' });
    decoUpd = t => tf(g, { x: lerp(200, -760, t / D) });
  } else if (variant === 'rays') {  // Throneroom: rotating light rays
    const r = el('div', 'ab', deco); css(r, { left: '-460px', top: '420px', width: '2000px', height: '2000px', borderRadius: '50%',
      background: `repeating-conic-gradient(from 0deg, ${S.acc}22 0deg 6deg, transparent 6deg 18deg)`, maskImage: 'radial-gradient(circle, #000 20%, transparent 65%)', WebkitMaskImage: 'radial-gradient(circle, #000 20%, transparent 65%)' });
    decoUpd = t => tf(r, { r: t * 14, o: E(t, 0, .8) });
  } else if (variant === 'pins') {  // Crib: map pins dropping with a verified tick
    const pins = [[150, 1000], [880, 900], [200, 1500], [900, 1420], [120, 1250]].map(([x, y]) => { const p = el('div', 'ab', deco,
      `<svg width="90" height="120" viewBox="0 0 24 32"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="${S.acc}"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>`); css(p, { left: x - 45 + 'px', top: y - 120 + 'px' }); return p; });
    decoUpd = t => pins.forEach((p, k) => { const q = pr(t, .25 + k * .12, .75 + k * .12); tf(p, { y: (1 - spring(q, 2.5, 7)) * -260, o: q > 0 ? 1 : 0 }); });
  } else if (variant === 'basket') { // Meji: price counter rolling into the basket
    const tag = el('div', 'ab pill', deco, `<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 6h18l-2 12H5z"/><path d="M8 6a4 4 0 0 1 8 0"/></svg><span>Added · £12.99</span>`);
    css(tag, { left: '600px', top: '1500px', fontSize: '34px', background: S.acc, color: '#fff', padding: '22px 34px', zIndex: 6 });
    decoUpd = t => { const q = pr(t, .95, 1.35); tf(tag, { s: q > 0 ? oB(q) : 0, o: q > 0 ? 1 : 0, r: -4 }); };
  }
  const stillT = S.m.map((_, k) => .35 + k * Math.max(.3, (D - .7) / S.m.length));
  return t => {
    decoUpd(t);
    rise(label, t, .05, { st: .02 }); rise(name, t, .1); rise(job, t, .18, { st: .06, d: .6 });
    // phone entrance differs by variant
    let ph_ = { x: px, y: py0 };
    const p = pr(t, 0, .7);
    if (variant === 'basket' || variant === 'pins') ph_ = { x: px, y: lerp(H, py0, oB(p, 1.2)), r: lerp(8, 0, oC(p)) };
    else if (variant === 'clock') ph_ = { x: px, y: py0, s: lerp(.6, 1, oE(p)), o: oE(p) * 1 };
    else if (variant === 'giant') ph_ = { x: lerp(W, px, oE(p)), y: py0, r: lerp(10, 0, oE(p)) };
    else if (variant === 'rays') ph_ = { x: px, y: lerp(py0 + 300, py0, oE(p)), o: oE(p), b: (1 - oE(p)) * 20 };
    tf(ph.root, { ...ph_, y: ph_.y - t * 18 });
    seq(ph, t, stillT);
    tf(url, { x: -url.offsetWidth / 2, y: 0, o: E(t, .5, .9) });
  };
}

// Search + AI answer: SEO / GEO / AEO
function findScene(root, D, head) {
  bg(root, '#F3F4F7'); const m = mark(root, '#0D0E12');
  const h = TX(root, head, 'h', { left: '60px', top: '200px', width: '960px', fontSize: '108px', color: '#0D0E12' });
  // search card
  const sc = el('div', 'ab', root); css(sc, { left: '60px', top: '560px', width: '960px', height: '560px', borderRadius: '36px', background: '#fff', boxShadow: '0 30px 80px rgba(20,24,40,.12)', overflow: 'hidden' });
  const sb = el('div', 'ab', sc); css(sb, { left: '36px', top: '36px', width: '888px', height: '96px', borderRadius: '48px', border: '2px solid #E2E5EB', display: 'flex', alignItems: 'center', padding: '0 34px', gap: '22px' });
  sb.innerHTML = `<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#6b6f78" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="q" style="font:500 38px 'Instrument Sans';color:#0D0E12"></span><span class="car" style="width:3px;height:44px;background:#2A2BFF"></span>`;
  const q = sb.querySelector('.q'), car = sb.querySelector('.car');
  const res = [0, 1, 2].map(k => { const r = el('div', 'ab', sc); css(r, { left: '36px', top: 170 + k * 128 + 'px', width: '888px', height: '108px', borderRadius: '22px', padding: '18px 26px', background: k ? '#fff' : '#EEF0FF', border: k ? '2px solid #EEF0F3' : '2px solid #2A2BFF' });
    r.innerHTML = k ? `<div style="width:${360 - k * 80}px;height:20px;border-radius:10px;background:#E7EAF0"></div><div style="margin-top:16px;width:${700 - k * 120}px;height:16px;border-radius:8px;background:#F0F2F5"></div>`
      : `<div style="font:600 24px 'Instrument Sans';color:#2A2BFF">yourbrand.com</div><div style="font:700 34px 'Instrument Sans';color:#0D0E12;margin-top:6px">Your brand · exactly what they searched for</div>`; return r; });
