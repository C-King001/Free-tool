<!doctype html><html><head><meta charset="utf-8"><title>Portfolio ad</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* 1080x1920 TikTok ad scene. ad.js sets ?concept= and calls drawFrame(t) for every frame.
   Every shot is a device (phone or laptop) filmed by a virtual camera that zooms in on the action,
   steered by the cursor/tap positions recorded with each clip.
   Captions stay in TikTok's safe zone: clear of the bottom ~20% and the right-hand icon column. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d0f14;font-family:'Plus Jakarta Sans',sans-serif;color:#fff}
#glow{position:absolute;inset:-200px;background:radial-gradient(800px 900px at 50% 55%,var(--g,#1f5fff) 0%,transparent 70%);opacity:.4;filter:blur(40px)}
.layer{position:absolute;inset:0;overflow:hidden}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.dev{position:absolute;left:0;top:0;display:none}
.phone{position:relative;width:422px;height:876px;border-radius:66px;padding:16px;background:#111317;
 box-shadow:0 0 0 2px #3a3e45 inset,0 0 0 3px #a9aeb6,0 60px 90px -20px rgba(0,0,0,.7)}
.pscreen{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:#fff}
.pscreen video{position:absolute;left:0;top:50px;width:390px;height:794px;object-fit:cover;background:#fff}
.island{position:absolute;top:12px;left:50%;width:120px;height:34px;margin-left:-60px;background:#000;border-radius:20px;z-index:4}
.sbar{position:absolute;left:0;right:0;top:0;height:50px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 44px;font:600 16px -apple-system,'Plus Jakarta Sans',sans-serif;color:#111;z-index:3}
.tap{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);opacity:0;z-index:5}
.laptop{width:1520px}
.lid{position:relative;width:1336px;height:856px;margin:0 auto;background:#0d0f12;border-radius:26px 26px 6px 6px;padding:26px 28px 30px;box-shadow:0 0 0 2px #2b2e33 inset,0 0 0 1px #9aa0a8}
.screen{position:relative;width:1280px;height:800px;overflow:hidden;background:#fff;border-radius:4px}
.screen video{position:absolute;inset:0;width:1280px;height:800px;object-fit:cover}
.base{position:relative;width:1520px;height:30px;margin-top:-2px;background:linear-gradient(180deg,#e4e6ea 0%,#c9ccd2 45%,#9ea3ab 100%);border-radius:3px 3px 26px 26px}
.cursor{position:absolute;left:0;top:0;width:40px;height:40px;margin:-2px 0 0 -3px;opacity:0;z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transform-origin:3px 2px}
.ripple{position:absolute;left:0;top:0;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;border:4px solid rgba(255,255,255,.95);box-shadow:0 0 0 2px rgba(0,0,0,.3);opacity:0;z-index:5}
.wire{position:absolute;inset:0;background:#e9eaee;z-index:6;display:none;padding:60px 90px}
.wire i{display:block;background:#cfd2d8;border-radius:12px;margin-bottom:28px}
.count{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:180px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30;pointer-events:none}
/* captions: centred, big, on a dark glass card so they read over any website */
#text{position:absolute;left:60px;right:150px;top:210px;z-index:20;display:flex;flex-direction:column;align-items:flex-start}
.cap{display:inline-block;padding:22px 30px 26px;border-radius:28px;background:rgba(10,12,18,.72);backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.pill{display:inline-block;padding:10px 22px;border-radius:999px;background:var(--hl,#ffd84d);color:#111;font-size:30px;font-weight:800;letter-spacing:.3px;margin-bottom:14px}
.head{font-size:92px;font-weight:800;line-height:1.0;letter-spacing:-2.5px}
.head em{font-style:normal;color:var(--hl,#ffd84d)}
.line{font-size:58px;font-weight:800;line-height:1.08;letter-spacing:-1px}
.line b{color:var(--hl,#ffd84d)}
#slam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 110px 0 70px;font-size:170px;font-weight:800;letter-spacing:-5px;line-height:.95;z-index:25;opacity:0}
.swipe{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:rgba(255,255,255,.5);border:3px solid #fff;opacity:0;z-index:22}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;z-index:40;opacity:0;text-align:center;padding:0 80px;
 background:radial-gradient(900px 700px at 50% 42%,color-mix(in srgb,var(--g,#1f5fff) 40%,#14161c) 0%,#0d0f14 72%)}
#end .by{font-size:36px;font-weight:700;letter-spacing:8px;text-transform:uppercase;color:rgba(255,255,255,.7)}
#end .name{font-size:170px;font-weight:800;letter-spacing:-5px;line-height:1;margin-top:-20px}
#end .name span{color:var(--hl,#ffd84d)}
#end .cta{display:inline-flex;align-items:center;gap:18px;padding:32px 54px;border-radius:999px;background:#fff;color:#111;font-size:44px;font-weight:800}
#end .cta svg{width:38px;height:38px}
</style></head><body>
<div id="glow"></div>
<div class="layer" id="LA"></div><div class="layer" id="LB"></div>
<div id="text"></div>
<div id="slam"></div>
<div class="swipe" id="swipe"></div>
<div class="flash" id="flash"></div>
<div id="end"><div class="by">Designed &amp; built by</div><div class="name">Faithful<span>.</span></div>
 <div class="cta"><span>Send a message to book a call</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>
<script>
const E=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, C=(x,a,b)=>Math.min(1,Math.max(0,(x-a)/(b-a))), L=(a,b,k)=>a+(b-a)*k;
const OUT=t=>1-Math.pow(1-t,3), $=id=>document.getElementById(id);
const CONCEPT=new URLSearchParams(location.search).get('concept')||'feed';
// window.CLIPS is injected by ad.js: {food:{base,fps,frames,meta,...offsets}, ...}
const GLOW={food:'#e8501a',careers:'#2f6bff',faith:'#b98d44',ecom:'#ef7a12'};

/* ---------- two layers (current shot + next shot during a swipe), each with a phone and a laptop ---------- */
const SBAR='<div class="sbar"><span>9:41</span><span>●●● ▮</span></div>';
function makeLayer(L){L.innerHTML=`<div class="world">
 <div class="dev ph"><div class="phone"><div class="pscreen"><div class="island"></div>${SBAR}<video muted playsinline preload="auto"></video><div class="tap"></div></div></div></div>
 <div class="dev lp"><div class="laptop"><div class="lid"><div class="screen"><video muted playsinline preload="auto"></video>
  <div class="wire"><i style="height:50px;width:30%"></i><i style="height:80px;width:70%;margin-top:60px"></i><i style="height:80px;width:55%"></i><i style="height:240px;width:100%;margin-top:40px"></i><i style="height:34px;width:80%"></i><div class="count">3</div></div>
  <div class="ripple"></div><svg class="cursor" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.4L20.5 11z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div><div class="base"></div></div></div>
 </div>`;return L;}
const LAYERS=[makeLayer($('LA')),makeLayer($('LB'))];

// Device geometry (natural px). Site coords: desktop 1440x900, phone 390x794 below a 50px status bar.
const GEO={
 mob:{fit:1040/390, sx:16, sy:16+50, k:1, scr:[16,16,406,860]},           // fit: screen 1040px wide
 desk:{fit:1080/1280, sx:120, sy:26, k:1280/1440, scr:[120,26,1400,826]}};  // fit: screen fills the frame width
const toDev=(dev,x,y)=>{const g=GEO[dev];return [g.sx+x*g.k, g.sy+y*g.k];};

/* ---------- clips ---------- */
const jobs=[];
function frameOf(clip,t){const c=CLIPS[clip];return Math.min(c.frames-1,Math.max(0,Math.round(t*c.fps)));}
function queue(video,clip,dev,t){const c=CLIPS[clip];const src=c.base+(dev==='desk'?'desk.webm':'mob.webm');
 jobs.push({video,src,time:Math.max(0,Math.min(t,c.frames/c.fps-0.02))});}
async function flush(){
 await Promise.all(jobs.map(async j=>{const v=j.video;
  if(v.dataset.src!==j.src){v.dataset.src=j.src;v.src=j.src;await new Promise(r=>{v.addEventListener('loadeddata',r,{once:true});setTimeout(r,8000);});}
  if(Math.abs(v.currentTime-j.time)>1e-3){v.currentTime=j.time;await new Promise(r=>{v.addEventListener('seeked',r,{once:true});setTimeout(r,3000);});}
 }));jobs.length=0;}
// Smoothed cursor (desk) or tap (mob) position around a clip time, so the camera glides instead of jittering.
function action(clip,dev,t,win=.35){const c=CLIPS[clip],f0=frameOf(clip,t-win),f1=frameOf(clip,t+win);let sx=0,sy=0,n=0;
 for(let f=f0;f<=f1;f++){const m=c.meta[f];const p=m&&(dev==='desk'?m[0]:m[1]);if(p&&(dev==='mob'||p[2]>.2)){sx+=p[0];sy+=p[1];n++;}}
 return n?[sx/n,sy/n]:null;}

/* ---------- draw one shot into a layer ----------
   shot: {dev, clip, from, cam:[{t,z,x,y,follow}]}  z = zoom (1 = screen fills the frame width), x,y = focus in site px.
   follow (0..1) pulls the focus toward the live cursor/tap. */
function camAt(sh,lt){const ks=sh.cam;let a=ks[0],b=ks[ks.length-1];
 for(let i=0;i<ks.length-1;i++) if(lt>=ks[i].t&&lt<=ks[i+1].t){a=ks[i];b=ks[i+1];break;}
 const k=a===b?0:E(C(lt,a.t,b.t));const f=L(a.follow||0,b.follow||0,k);
 let x=L(a.x,b.x,k),y=L(a.y,b.y,k),z=L(a.z,b.z,k);
 if(f>0){const p=action(sh.clip,sh.dev,sh.from+lt);if(p){x=L(x,p[0],f);y=L(y,p[1],f);}}
 return {x,y,z};}
function drawShot(layer,sh,lt,yOff=0,extraZ=1){
 const g=GEO[sh.dev],w=layer.querySelector('.world'),ph=layer.querySelector('.ph'),lp=layer.querySelector('.lp');
 const D=sh.dev==='mob'?ph:lp;ph.style.display=sh.dev==='mob'?'block':'none';lp.style.display=sh.dev==='desk'?'block':'none';
 const cam=camAt(sh,lt);const s=g.fit*cam.z*extraZ;let [fx,fy]=toDev(sh.dev,cam.x,cam.y);
 // keep the screen covering the frame when zoomed in, so no empty edges show
 const hw=540/s,hh=(sh.cy||960)/s,[x0,y0,x1,y1]=g.scr;
 if(x1-x0>2*hw) fx=Math.min(x1-hw,Math.max(x0+hw,fx)); else fx=(x0+x1)/2;
 if(sh.dev==='mob'&&!sh.free&&(y1-y0)>2*hh) fy=Math.min(y1-(1920-(sh.cy||960))/s,Math.max(y0+hh,fy));
 w.style.transform=`translate(${540-fx*s}px,${(sh.cy||960)-fy*s+yOff}px) scale(${s})`;
 const v=D.querySelector('video');queue(v,sh.clip,sh.dev,sh.from+lt);
 const m=CLIPS[sh.clip].meta[frameOf(sh.clip,sh.from+lt)]||[];
 if(sh.dev==='mob'){const el=D.querySelector('.tap'),tp=m[1];if(tp){const k=tp[2];el.style.opacity=k<.25?k/.25:1-(k-.25)/.75;
   el.style.transform=`translate(${tp[0]}px,${tp[1]+50}px) scale(${k<.25?.6+.4*k/.25:1+.4*(k-.25)})`;}else el.style.opacity=0;}
 else{const cur=D.querySelector('.cursor'),rp=D.querySelector('.ripple'),c=m[0];
  if(c){const x=c[0]*g.k,y=c[1]*g.k;cur.style.opacity=c[2];cur.style.transform=`translate(${x}px,${y}px) scale(${c[3]?.82:1})`;
   if(c[4]>=0){rp.style.opacity=1-c[4];rp.style.transform=`translate(${x}px,${y}px) scale(${.4+1.4*c[4]})`;}else rp.style.opacity=0;}
  else{cur.style.opacity=0;rp.style.opacity=0;}}
 layer.style.display='block';}
const hideLayer=l=>{l.style.display='none';};

/* ---------- text ---------- */
let lastText='';
function text(html){if(html!==lastText){$('text').innerHTML=html;lastText=html;}}
function caption(lt,label,line,big=false){const k=OUT(C(lt,0,.22));
 text(`<div class="cap" style="opacity:${k};transform:translateY(${(1-k)*24}px) scale(${.96+.04*k})">${label?`<div class="pill">${label}</div><br>`:''}<div class="${big?'head':'line'}">${line}</div></div>`);}
function slam(word,t,t0,t1){const s=$('slam');if(t<t0||t>=t1){s.style.opacity=0;return;}
 const k=OUT(C(t,t0,t0+.18));s.style.opacity=1;s.innerHTML=`<div>${word}</div>`;s.style.transform=`scale(${1.3-.3*k})`;}
function glow(c){document.documentElement.style.setProperty('--g',c);}
function endCard(t,t0){const e=$('end');const k=E(C(t,t0,t0+.3));e.style.opacity=k;
 [['.by',.05],['.name',.12],['.cta',.25]].forEach(([q,d])=>{const el=e.querySelector(q);const v=OUT(C(t,t0+d,t0+d+.35));el.style.opacity=v;el.style.transform=`translateY(${40*(1-v)}px)`;});
 const p=(t-t0-.9)%1.1/1.1;e.querySelector('.cta').style.boxShadow=t-t0>.9?`0 0 0 ${24*p}px rgba(255,255,255,${.4*(1-p)})`:'none';}
function reset(){LAYERS.forEach(hideLayer);$('end').style.opacity=0;$('slam').style.opacity=0;$('flash').style.opacity=0;$('swipe').style.opacity=0;
 document.querySelectorAll('.wire').forEach(w=>w.style.display='none');}

/* ---------- shots used by the ads (clip offsets come from ad.js) ---------- */
const O=k=>CLIPS[k];
const SH={
 // phone: whole page turns red on the Spicy tap, camera breathes in slightly
 foodMob:()=>({dev:'mob',clip:'food',from:O('food').feed,cy:1000,cam:[{t:0,z:1,x:195,y:420},{t:3.6,z:1.1,x:195,y:420}]}),
 // laptop: start close on the flavour tabs following the cursor, pull back after the click to show the whole page change
 foodDesk:()=>({dev:'desk',clip:'food',from:O('food').hero,cy:1060,cam:[{t:0,z:1.9,x:320,y:640,follow:.9},{t:1.0,z:1.9,x:320,y:640,follow:.9},{t:1.7,z:1.35,x:720,y:400},{t:3.2,z:1.45,x:720,y:400}]}),
 // phone: the brochure card, close enough to see the lens open into the room
 careersMob:()=>({dev:'mob',clip:'careers',from:O('careers').feed,cy:1040,cam:[{t:0,z:1.05,x:195,y:430},{t:1.4,z:1.25,x:195,y:520},{t:3.8,z:1.3,x:195,y:470}]}),
 // laptop: follow the cursor across the brochure as the room shows through
 careersDesk:()=>({dev:'desk',clip:'careers',from:O('careers').sweep,cy:1060,cam:[{t:0,z:1.85,x:900,y:420,follow:.8},{t:3.2,z:1.95,x:900,y:420,follow:.8}]}),
 // phone: the 25-year counter, big
 faithMob:()=>({dev:'mob',clip:'faith',from:O('faith').feed,cy:1000,free:true,cam:[{t:0,z:1.0,x:195,y:560},{t:.9,z:1.35,x:140,y:752},{t:3.2,z:1.42,x:140,y:752}]}),
 // laptop: follow the cursor across the pillar cards as each turns burgundy
 faithDesk:()=>({dev:'desk',clip:'faith',from:O('faith').sweep,cy:1060,cam:[{t:0,z:1.75,x:720,y:330,follow:.85},{t:3.2,z:1.85,x:720,y:330,follow:.85}]}),
 // phone: the product card as the designs switch
 ecomMob:()=>({dev:'mob',clip:'ecom',from:O('ecom').feed,cy:1040,cam:[{t:0,z:1.1,x:195,y:330},{t:3.9,z:1.22,x:195,y:330}]}),
};

/* ---------- concept 1: The Feed ---------- */
function feed(t){
 const segs=[
  {sh:SH.foodMob(),d:3.4,label:'Food brand',line:'Tap → the <b>whole page</b> changes'},
  {sh:SH.careersMob(),d:3.9,label:'Careers platform',line:'Scroll → the brochure <b>opens</b>'},
  {sh:SH.faithMob(),d:3.0,label:'Faith organisation',line:'Numbers that <b>count up</b> live'},
  {sh:SH.ecomMob(),d:3.8,label:'E-commerce store',line:'Tap → <b>new design</b>, instantly'}];
 const SW=.38;let acc=0;const starts=segs.map(s=>{const a=acc;acc+=s.d;return a;});
 const tGrid=acc,tEnd=tGrid+2.0,total=tEnd+2.8;
 if(t<tGrid){
  let i=segs.length-1;for(let j=0;j<segs.length;j++) if(t<starts[j]+segs[j].d){i=j;break;}
  const s=segs[i],lt=t-starts[i],sw=i<segs.length-1?E(C(lt,s.d-SW,s.d)):0;
  drawShot(LAYERS[0],s.sh,lt,-1920*sw,1);
  if(sw>0){const n=segs[i+1];drawShot(LAYERS[1],n.sh,0,1920*(1-sw),1);}
  glow(GLOW[s.sh.clip]);
  const fs=$('swipe');if(sw>0&&sw<1){fs.style.opacity=Math.sin(sw*Math.PI);fs.style.left='540px';fs.style.top=(1450-650*sw)+'px';}
  if(i===0&&lt<1.9){const k=OUT(C(t,0,.25));text(`<div class="cap" style="opacity:${k};transform:scale(${.94+.06*k})"><div class="head">4 businesses.<br>4 websites.<br><em>1 designer.</em></div></div>`);}
  else caption(i===0?lt-1.9:lt-.05,s.label,s.line);
  return total;}
 if(t<tEnd){ // all four at once, each a full live screen
  const g=OUT(C(t,tGrid,tGrid+.35));glow('#7a5cff');
  const cells=[[24,380],[552,380],[24,1150],[552,1150]];
  const W=$('LA');hideLayer($('LB'));W.style.display='block';
  W.querySelector('.world').style.transform='none';W.querySelector('.ph').style.display='none';W.querySelector('.lp').style.display='none';
  if(!W.querySelector('.grid')){const gd=document.createElement('div');gd.className='grid';gd.innerHTML=[0,1,2,3].map(()=>`<div style="position:absolute;width:504px;height:740px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 30px 60px rgba(0,0,0,.5)"><video muted playsinline preload="auto" style="width:100%;height:100%;object-fit:cover;object-position:top"></video></div>`).join('');W.appendChild(gd);}
  const gd=W.querySelector('.grid');gd.style.display='block';
  [...gd.children].forEach((cell,j)=>{const [x,y]=cells[j];const kk=OUT(C(t,tGrid+j*.07,tGrid+j*.07+.35));cell.style.left=x+'px';cell.style.top=y+'px';cell.style.opacity=kk;cell.style.transform=`scale(${.85+.15*kk})`;
   const s=segs[j].sh;queue(cell.querySelector('video'),s.clip,'mob',s.from+1.2+(t-tGrid));});
  text(`<div class="cap" style="opacity:${g}"><div class="line" style="font-size:64px">Every one built to <b>sell</b>.</div></div>`);
  return total;}
 const gd=document.querySelector('.grid');if(gd)gd.style.display='none';
 text('');endCard(t,tEnd);return total;}

/* ---------- concept 3: Your website has 3 seconds ---------- */
function three(t){
 const segs=[
  {sh:SH.foodDesk(),d:3.2,label:'Food brand',line:'Click → the <b>whole page</b> changes'},
  {sh:SH.careersDesk(),d:3.2,label:'Careers platform',line:'Hover → the <b>real room</b> shows through'},
  {sh:SH.faithDesk(),d:3.2,label:'Faith organisation',line:'Every card <b>answers</b> your cursor'},
  {sh:SH.ecomMob(),d:3.4,label:'E-commerce store',line:'Tap → <b>new design</b>, instantly'}];
 const tA=1.7;let acc=tA;const starts=segs.map(s=>{const a=acc;acc+=s.d;return a;});
 const tMine=acc,tEnd=tMine+1.3,total=tEnd+2.8;
 if(t<tA){ // a dead grey page and a fast countdown
  const sh={dev:'desk',clip:'food',from:O('food').hero,cy:1150,cam:[{t:0,z:1.25,x:720,y:450},{t:tA,z:1.35,x:720,y:450}]};
  drawShot(LAYERS[0],sh,t);const W=LAYERS[0].querySelector('.wire');W.style.display='block';
  const n=t<.55?3:t<1.1?2:1;const cnt=W.querySelector('.count');cnt.textContent=n;const k=(t%.55)/.55;cnt.style.transform=`scale(${1.2-.2*OUT(Math.min(1,k*3))})`;
  glow('#555b66');const kk=OUT(C(t,0,.2));
  text(`<div class="cap" style="opacity:${kk};transform:scale(${.94+.06*kk})"><div class="head" style="font-size:86px">Your website has<br><em>3 seconds</em> to make<br>someone stay.</div></div>`);
  $('flash').style.opacity=C(t,tA-.12,tA);return total;}
 $('flash').style.opacity=1-C(t,tA,tA+.3);
 if(t<tMine){
  let i=segs.length-1;for(let j=0;j<segs.length;j++) if(t<starts[j]+segs[j].d){i=j;break;}
  const s=segs[i],lt=t-starts[i];const punch=1+.06*(1-OUT(C(lt,0,.3)));   // small punch-in on every cut
  drawShot(LAYERS[0],s.sh,lt,0,punch);glow(GLOW[s.sh.clip]);caption(lt-.05,s.label,s.line);return total;}
 if(t<tEnd){text('');glow('#ffd84d');slam('Mine don’t<br><span style="color:#ffd84d">waste them.</span>',t,tMine,tEnd);return total;}
 text('');endCard(t,tEnd);return total;}

/* ---------- concept 5: Whatever you sell ---------- */
function sell(t){
 const beats=[
  {word:'Food?',sh:SH.foodDesk(),label:'Food brand'},
  {word:'Faith?',sh:SH.faithMob(),label:'Faith organisation'},
  {word:'Careers?',sh:SH.careersDesk(),label:'Careers platform'},
  {word:'Baby products?',sh:SH.ecomMob(),label:'E-commerce store'}];
 const SL=.45,SHT=2.9,B=SL+SHT,tNext=B*beats.length,tEnd=tNext+1.2,total=tEnd+2.8;
 if(t<tNext){
  const i=Math.floor(t/B),lt=t-i*B,b=beats[i];glow(GLOW[b.sh.clip]);
  if(lt<SL){text('');slam(b.word,t,i*B,i*B+SL);return total;}
  const st=lt-SL;const punch=1+.06*(1-OUT(C(st,0,.3)));
  // the beat starts a little into the clip so the action is already under way
  const sh={...b.sh,from:b.sh.from+(b.sh.dev==='desk'?.15:.2)};
  drawShot(LAYERS[0],sh,st,0,punch);
  text(`<div class="cap"><div class="pill">${b.label}</div><br><div class="head">${b.word}</div></div>`);
  return total;}
 if(t<tEnd){text('');glow('#ffd84d');slam('Your business<br><span style="color:#ffd84d">next.</span>',t,tNext,tEnd);return total;}
 text('');endCard(t,tEnd);return total;}

const CONCEPTS={feed,three,sell};
window.duration=()=>{reset();const d=CONCEPTS[CONCEPT](0);jobs.length=0;return d;};
window.drawFrame=async t=>{reset();CONCEPTS[CONCEPT](t);await flush();};
</script></body></html>
